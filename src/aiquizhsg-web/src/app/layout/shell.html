<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <img class="brand-mark" src="brand/omiq-icon.jpg" width="40" height="40" alt="OMIQ" />
      <div>
        <strong>OMIQ</strong>
        <small>Smart assessment</small>
      </div>
    </div>
    <nav aria-label="Menu chính">
      <p-accordion styleClass="nav-accordion" [multiple]="true" [(value)]="navPanels">
        @for (group of visible(); track group.label) {
          <p-accordion-panel [value]="group.label">
            <p-accordion-header>
              <span class="nav-group-title">
                <i [class]="group.icon" aria-hidden="true"></i>
                <span>{{ group.label }}</span>
              </span>
            </p-accordion-header>
            <p-accordion-content>
              <div class="nav-links">
                @for (item of group.items; track item.path) {
                  <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.exact }">
                    <i [class]="item.icon" aria-hidden="true"></i>
                    <span>{{ item.label }}</span>
                  </a>
                }
              </div>
            </p-accordion-content>
          </p-accordion-panel>
        }
      </p-accordion>
    </nav>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="me">
        <strong>{{ store.user()?.fullName }}</strong>
      </div>
      <p-tag [value]="roleText()" severity="secondary" />
      <p-button label="Đăng xuất" icon="pi pi-sign-out" severity="secondary" [outlined]="true" (onClick)="logout()" />
    </header>
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
