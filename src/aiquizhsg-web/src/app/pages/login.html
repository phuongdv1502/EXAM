<div class="login-page">
  <div class="login-card">
    <p-card>
      <div class="login-brand">
        <img src="brand/omiq-logo.jpg" alt="OMIQ" />
        <strong>Đăng nhập</strong>
        <span>Chấm phiếu thông minh · Quản lý đề thi</span>
      </div>
      <form class="stack" (ngSubmit)="submit()">
        <div class="field">
          <label for="username">Tên đăng nhập</label>
          <input pInputText id="username" name="username" [(ngModel)]="username" autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <input pInputText id="password" type="password" name="password" [(ngModel)]="password" autocomplete="current-password" />
        </div>
        <p-button label="Đăng nhập" icon="pi pi-sign-in" type="submit" [fluid]="true" [loading]="loading" />
      </form>
    </p-card>
  </div>
</div>
