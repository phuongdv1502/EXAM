<div class="page-head">
  <div>
    <h1>Phân quyền</h1>
    <p>Quyền lưu ở đây áp dụng cho mọi tài khoản mang vai trò đó. Quyền riêng từng người đặt ở màn Tài khoản.</p>
  </div>
</div>
<div class="split">
  <p-card header="Vai trò">
    <div class="role-list">
      @for (role of roles; track role.id) {
        <p-button [label]="role.name" [outlined]="selectedId !== role.id" [text]="selectedId !== role.id" (onClick)="select(role.id)" />
      }
    </div>
  </p-card>
  <p-card [header]="selectedRole() ? selectedRole()!.name : 'Chọn vai trò'">
    @for (module of modules(); track module) {
      <section class="perm-module">
        <h3>{{ module }}</h3>
        @for (item of inModule(module); track item.id) {
          <div class="choice">
            <p-checkbox [binary]="true" [inputId]="'perm' + item.id" [name]="'perm' + item.id" [ngModel]="checked[item.id]" (ngModelChange)="checked[item.id] = $event" />
            <label [for]="'perm' + item.id">{{ item.name }} <span class="muted">{{ item.code }}</span></label>
          </div>
        }
      </section>
    }
    <div class="row-actions">
      <p-button label="Lưu quyền" icon="pi pi-check" (onClick)="save()" [loading]="loading" [disabled]="selectedId === null || permissions.length === 0" />
    </div>
  </p-card>
</div>
